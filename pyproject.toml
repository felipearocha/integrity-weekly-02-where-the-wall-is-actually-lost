[project]
name = "integrity-weekly-02-where-the-wall-is-actually-lost"
version = "1.0.0"
description = "Where the wall is actually lost: runnable integrity engineering code with tests"
requires-python = ">=3.11"
authors = [{ name = "Felipe Rocha" }]
license = { text = "MIT" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Scripts keep their data first and the published lines together, as shown in the posts.
"code/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
